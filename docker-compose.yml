version: "3.8"

services:
  mysql-db:
    image: mysql:8.3.0
    container_name: mysql_shared_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: endorse_db
      MYSQL_USER: db_user
      MYSQL_PASSWORD: db_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-prootpassword",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - network-red

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: mysql_admin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql-db
      MYSQL_ROOT_PASSWORD: rootpassword
    networks:
      - network-red
    depends_on:
      - mysql-db

  backend-traductor:
    build:
      context: ./backend-traductor
      dockerfile: Dockerfile
    container_name: api_backend_traductor
    restart: always
    ports:
      - "3150:4000"
    environment:
      - PORT=4000
      - DB_HOST=mysql-db
      - DB_USER=db_user
      - DB_PASSWORD=db_password
      - DB_NAME=endorse_db
    networks:
      - network-red
    depends_on:
      mysql-db:
        condition: service_healthy

  backend-gestion-siniestros:
    build:
      context: ./backend-gestion-siniestros
      dockerfile: Dockerfile
    container_name: api_backend_siniestros
    restart: always
    ports:
      - "3250:4001" # Expuesto en el puerto 3250 (o el que estés usando para tus pruebas)
    environment:
      - PORT=4001
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - DB_USER=db_user
      - DB_PASSWORD=db_password
      - DB_NAME=siniestros_db
    networks:
      - network-red
    depends_on:
      - mysql-db

  frontend-traductor:
    build:
      context: ./frontend-traductor
      dockerfile: Dockerfile
    container_name: app_frontend_traductor
    restart: always
    ports:
      - "3100:80"
    environment:
      - REACT_APP_API_URL=http://localhost:3150
    networks:
      - network-red
    depends_on:
      - backend-traductor

  frontend-gestion-siniestros:
    build:
      context: ./frontend-gestion-siniestros
      dockerfile: Dockerfile
    container_name: app_frontend_siniestros
    restart: always
    ports:
      - "3200:80"
    networks:
      - network-red
    depends_on:
      - backend-gestion-siniestros
      - backend-traductor

volumes:
  mysql_data:
    external: false

networks:
  network-red:
    driver: bridge
